<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="360" viewBox="0 0 1200 360" role="img" aria-label="VoiceOps 2026 - ZentroMart support agent">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#07111f"/>
      <stop offset="0.55" stop-color="#0b1c30"/>
      <stop offset="1" stop-color="#102a46"/>
    </linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#38bdf8"/>
      <stop offset="0.5" stop-color="#2dd4bf"/>
      <stop offset="1" stop-color="#a3e635"/>
    </linearGradient>
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40" fill="none" stroke="#ffffff" stroke-opacity="0.035" stroke-width="1"/>
    </pattern>
    <filter id="glow" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="12" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>

  <rect width="1200" height="360" rx="24" fill="url(#bg)"/>
  <rect width="1200" height="360" rx="24" fill="url(#grid)"/>
  <circle cx="1080" cy="52" r="150" fill="#38bdf8" fill-opacity="0.08"/>
  <circle cx="1135" cy="315" r="190" fill="#2dd4bf" fill-opacity="0.07"/>

  <rect x="64" y="54" width="58" height="6" rx="3" fill="url(#accent)" filter="url(#glow)"/>
  <text x="64" y="112" font-family="Segoe UI, Inter, Arial, sans-serif" font-size="52" font-weight="700" fill="#f8fafc">VoiceOps <tspan fill="#7dd3fc">2026</tspan></text>
  <text x="66" y="151" font-family="Segoe UI, Inter, Arial, sans-serif" font-size="23" font-weight="400" fill="#cbd5e1">ZentroMart support agent · grounded, tool-using, voice-native</text>
  <text x="66" y="185" font-family="Segoe UI, Inter, Arial, sans-serif" font-size="16" fill="#94a3b8">Reads the real policy · checks real order rows · never leaks verification values</text>

  <g font-family="Segoe UI, Inter, Arial, sans-serif" font-size="15" font-weight="600">
    <rect x="64" y="224" width="158" height="42" rx="21" fill="#0f2a44" stroke="#38bdf8" stroke-opacity="0.55"/>
    <text x="143" y="250" text-anchor="middle" fill="#bae6fd">Gnani STT</text>
    <rect x="240" y="224" width="190" height="42" rx="21" fill="#0f2a44" stroke="#2dd4bf" stroke-opacity="0.55"/>
    <text x="335" y="250" text-anchor="middle" fill="#99f6e4">RAG + tools</text>
    <rect x="448" y="224" width="158" height="42" rx="21" fill="#0f2a44" stroke="#a3e635" stroke-opacity="0.55"/>
    <text x="527" y="250" text-anchor="middle" fill="#d9f99d">Gnani TTS</text>
    <rect x="64" y="286" width="204" height="38" rx="19" fill="#0b2237" stroke="#ffffff" stroke-opacity="0.08"/>
    <text x="166" y="310" text-anchor="middle" fill="#93c5fd">23 / 23 conversations</text>
    <rect x="286" y="286" width="170" height="38" rx="19" fill="#0b2237" stroke="#ffffff" stroke-opacity="0.08"/>
    <text x="371" y="310" text-anchor="middle" fill="#86efac">96 / 96 turns</text>
    <rect x="474" y="286" width="166" height="38" rx="19" fill="#0b2237" stroke="#ffffff" stroke-opacity="0.08"/>
    <text x="557" y="310" text-anchor="middle" fill="#fde68a">54 / 54 tools</text>
  </g>

  <g transform="translate(790 70)">
    <rect width="340" height="220" rx="18" fill="#06101d" stroke="#ffffff" stroke-opacity="0.10"/>
    <circle cx="24" cy="24" r="5" fill="#f87171"/>
    <circle cx="42" cy="24" r="5" fill="#fbbf24"/>
    <circle cx="60" cy="24" r="5" fill="#34d399"/>
    <text x="24" y="61" font-family="Consolas, monospace" font-size="13" fill="#64748b">customer.wav</text>
    <rect x="24" y="75" width="292" height="1" fill="#ffffff" fill-opacity="0.07"/>
    <text x="24" y="104" font-family="Consolas, monospace" font-size="13" fill="#7dd3fc">STT  →  "refund kahaan hai"</text>
    <text x="24" y="132" font-family="Consolas, monospace" font-size="13" fill="#2dd4bf">RAG  →  REF-2, RET-7</text>
    <text x="24" y="160" font-family="Consolas, monospace" font-size="13" fill="#fbbf24">tool →  lookup_order()</text>
    <text x="24" y="188" font-family="Consolas, monospace" font-size="13" fill="#a3e635">TTS  →  reply.wav</text>
    <circle cx="316" cy="188" r="4" fill="#a3e635" filter="url(#glow)"/>
  </g>
</svg>
